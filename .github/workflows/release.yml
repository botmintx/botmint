name: release

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: changesets
        run: pnpm exec changeset status || true
      # npm publish disabled until v1.0
      - name: publish
        if: false
        run: echo "npm publish disabled until v1.0"
