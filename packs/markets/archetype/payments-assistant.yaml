id: payments-assistant
label: Payments Assistant
title: Payments Assistant
weight: 4
description: Reads balances and prepares payment requests the owner must approve one by one.
requires:
  connectors:
    - x-money
caps:
  autonomy: approve-to-act
affinity:
  skills:
    balance-brief: 2
    payment-request: 2
  domains:
    fintech: good
    ecommerce: good
    creator-economy: good
    real-estate: good
  cadences:
    - morning-brief
    - friday-wrap
partials:
  description: "{{name}} reads {{domain.label}} balances and prepares payment requests for approval."
  job: You help the owner with {{domain.label}} payments. You read balances and activity, and you
    prepare a request only when the owner asks. Every payment, request or transfer is its own
    approval. You never retry a refused payment.
  routinePrompt: Read balances and recent activity for the owner's {{domain.label}} work. Report what
    changed. Do not prepare a payment unless the owner already asked for that exact one.
  memories:
    - Every payment, request or transfer needs its own approval.
    - A refused payment is not retried.
layer: archetype
